name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minmurasu-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: minmurasu-crm/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway service container reachable only from this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: minmurasu-crm
    steps:
      - uses: actions/checkout@v4
      - name: Stub Supabase auth schema and roles
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_stub_supabase_auth.sql
      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: Re-apply latest migrations (must be idempotent)
        run: |
          for f in $(ls supabase/migrations/*.sql | tail -n 2); do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Run RLS / RPC tests
        run: psql -v ON_ERROR_STOP=1 -P pager=off -f supabase/tests/10_rls_and_rpcs.test.sql
      - name: Seed data loads
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
